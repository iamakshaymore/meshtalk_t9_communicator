[env:heltec-v4-custom] 
extends = esp32s3_base
board = heltec_v4
board_level = pr
board_check = true
board_build.partitions = default_16MB.csv
upload_port = /dev/cu.usbmodem1101

lib_deps =
    ${esp32s3_base.lib_deps}
    lovyan03/LovyanGFX@^1.2.0
    keypad

build_flags = 
    ${esp32s3_base.build_flags}
    -D HELTEC_V4
    -D HELTEC_V4_CUSTOM
    -D VARIANT_heltec_v4_custom
    -I variants/esp32s3/heltec-v4-custom
    
    ; Test: Disable PowerFSM and Bluetooth to check if light sleep causes 2-hour SNR degradation
    -D MESHTASTIC_EXCLUDE_POWER_FSM
    -D MESHTASTIC_EXCLUDE_BLUETOOTH
    
    ; V4 has PSRAM support - enable it for better graphics performance
    -D CONFIG_SPIRAM_SUPPORT=1
    -D BOARD_HAS_PSRAM=1
    
    ; Disable built-in display and screen modules
    -D HAS_SCREEN=0
    -D MESHTASTIC_EXCLUDE_SCREEN=1
    
    ; BLE enabled - using 8MB partition table for compatibility
    
    ; RAM Optimization - Option A: Disable commonly unused modules
    -D MESHTASTIC_EXCLUDE_AUDIO=1
    -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
    -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
    -D MESHTASTIC_EXCLUDE_RANGETEST=1
    -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
    -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
    -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
    -D MESHTASTIC_EXCLUDE_NEIGHBORINFO=1
    -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
    