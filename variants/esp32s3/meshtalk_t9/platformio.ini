[env:meshtalk-t9]
; ── Board identity ────────────────────────────────────────────────────────────
; 255 = PRIVATE_HW in Meshtastic's HardwareModel enum — correct for custom boards
; not yet submitted to Meshtastic officially
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = MeshTalk T9
custom_meshtastic_tags = Custom
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

; ── PlatformIO base ───────────────────────────────────────────────────────────
; Keep seeed-xiao-s3 as the SoC base — same ESP32-S3 chip, same SX1262 driver
; board_check = false because this board is not in Meshtastic's official list
extends = esp32s3_base
board = esp32-s3-devkitc-1
;board = heltec_v4_r8
board_check = false

; ── Flash — override seeed-xiao-s3 default (8MB) to your actual 16MB ─────────
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ── PSRAM — N16R8 has 8MB Octal SPI PSRAM ────────────────────────────────────
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L

upload_protocol = esptool
upload_speed = 921600
lib_deps =
    ${esp32s3_base.lib_deps}
    lovyan03/LovyanGFX@^1.2.26
    keypad


build_flags =
  ${esp32s3_base.build_flags}
  -D MESHTALK_T9
  -I variants/esp32s3/meshtalk_t9
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=0
  -D BOARD_HAS_PSRAM
  -D CONFIG_SPIRAM_SUPPORT=1

  ; --- Feature exclusions ---
  -D MESHTASTIC_EXCLUDE_AUDIO=1
  -D MESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -D MESHTASTIC_EXCLUDE_STOREFORWARD=1
  -D MESHTASTIC_EXCLUDE_RANGETEST=1
  -D MESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -D MESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -D MESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -D MESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -D MESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -D MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -D MESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -D MESHTASTIC_EXCLUDE_GPS=1
  -D MESHTASTIC_EXCLUDE_I2C=1
  -D MESHTASTIC_EXCLUDE_SCREEN=1
  -D MESHTASTIC_EXCLUDE_WAYPOINT=1
  -D MESHTASTIC_EXCLUDE_WIFI=1
  -D MESHTASTIC_EXCLUDE_MQTT=1
  -D MESHTASTIC_EXCLUDE_NTP=1
  -D MESHTASTIC_EXCLUDE_PORTAL=1

  ; --- Hardware ---
  -D HAS_SCREEN=0
  -D HAS_BUTTON=0

  ; --- RadioLib: only keep SX126x ---
  -D RADIOLIB_EXCLUDE_LR11X0=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  -D RADIOLIB_EXCLUDE_SX1272=1
  -D RADIOLIB_EXCLUDE_SX1276=1
  -D RADIOLIB_EXCLUDE_SX1278=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_APRS=1


custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_MBEDTLS_SHA512_C=y