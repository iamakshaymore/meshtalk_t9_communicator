[env:meshtalk-t9]
; ── Board identity ────────────────────────────────────────────────────────────
; 255 = PRIVATE_HW in Meshtastic's HardwareModel enum — correct for custom boards
; not yet submitted to Meshtastic officially
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = MeshTalk T9
custom_meshtastic_tags = Custom
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

; ── PlatformIO base ───────────────────────────────────────────────────────────
; Keep seeed-xiao-s3 as the SoC base — same ESP32-S3 chip, same SX1262 driver
; board_check = false because this board is not in Meshtastic's official list
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_check = false

; ── Flash — override seeed-xiao-s3 default (8MB) to your actual 16MB ─────────
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ── PSRAM — N16R8 has 8MB Octal SPI PSRAM ────────────────────────────────────
; qio_opi = Quad I/O for flash + Octal I/O for PSRAM
; Without qio_opi the PSRAM is NOT initialised even with BOARD_HAS_PSRAM set
; board_build.arduino.memory_type = qio_opi
; board_build.arduino.memory_type = dio_opi
; board_build.flash_mode = dio
; board_build.psram_type = opi

upload_protocol = esptool
upload_speed = 921600
lib_deps =
    ${esp32s3_base.lib_deps}
    lovyan03/LovyanGFX@^1.2.26
    keypad


build_flags =
  ${esp32s3_base.build_flags}
  -D MESHTALK_T9
  -I variants/esp32s3/meshtalk_t9
;   -Wl,--allow-multiple-definition
  ; -D BOARD_HAS_PSRAM
  ; -D CONFIG_SPIRAM_SUPPORT=1
  ; -D BOARD_HAS_PSRAM=1

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_MBEDTLS_SHA512_C=y