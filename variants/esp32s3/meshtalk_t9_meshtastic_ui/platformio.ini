[env:meshtalk-t9-ui]
; ── Board identity ────────────────────────────────────────────────────────────
; 255 = PRIVATE_HW — correct for custom boards not yet in Meshtastic's enum
custom_meshtastic_hw_model = 255
custom_meshtastic_hw_model_slug = PRIVATE_HW
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = MeshTalk T9 (Meshtastic UI)
custom_meshtastic_tags = Custom
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

; ── PlatformIO base ───────────────────────────────────────────────────────────
; Mirrors heltec-vision-master-t190 which uses the same USE_ST7789 path
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_check = false

; ── Flash — 16MB N16R8 ────────────────────────────────────────────────────────
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ── PSRAM — N16R8 has 8MB Octal SPI PSRAM ────────────────────────────────────
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L

upload_protocol = esptool
upload_speed = 921600

lib_deps =
    ${esp32s3_base.lib_deps}
    ; meshtastic/st7789 — same SHA as heltec-vision-master-t190
    ; renovate: datasource=git-refs depName=meshtastic-st7789 packageName=https://github.com/meshtastic/st7789 gitBranch=main
    https://github.com/meshtastic/st7789/archive/92bae2e4a307afb430c3b0bc3d661c55ee1565f0.zip

; Inherit the full esp32s3_base filter chain (excludes nRF52, RP2040, niche graphics, etc.)
; then append CustomUI (needs LovyanGFX, not a dep here) and eth (RAK13800 not on T9).
build_src_filter =
    ${esp32s3_base.build_src_filter}
    -<modules/CustomUI/*>
    -<mesh/eth/*>

build_flags =
  ${esp32s3_base.build_flags}
  -D MESHTALK_T9_UI
  -I variants/esp32s3/meshtalk_t9_meshtastic_ui
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D ARDUINO_USB_MODE=0
  -D BOARD_HAS_PSRAM
  -D CONFIG_SPIRAM_SUPPORT=1
  -DOLEDDISPLAY_REDUCE_MEMORY

  ; ── RadioLib: only keep SX126x ──────────────────────────────────────────────
  -D RADIOLIB_EXCLUDE_LR11X0=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_LR2021=1
  -D RADIOLIB_EXCLUDE_SX1272=1
  -D RADIOLIB_EXCLUDE_SX1276=1
  -D RADIOLIB_EXCLUDE_SX1278=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_APRS=1

custom_sdkconfig =
  ${esp32s3_base.custom_sdkconfig}
  CONFIG_MBEDTLS_SHA512_C=y
